<script>
window.PNEC_SITE_BASE = {{ site.baseurl | default: "" | jsonify }};
window.PNEC_LOCAL_API_PORT = {{ site.local_api_port | default: 8425 | jsonify }};
window.PNEC_REMOTE_API_BASE = {{ site.api_base_url | default: "https://api.pnec-review.invalid" | jsonify }};
window.PNEC_API_BASE = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
  ? `http://${location.hostname}:${window.PNEC_LOCAL_API_PORT}`
  : window.PNEC_REMOTE_API_BASE;
window.PNEC_REVIEW_PREVIEW = {{ site.review_preview | default: false | jsonify }};
</script>
{% if site.review_preview %}
<script src="{{ '/assets/js/review-status.js' | relative_url }}" defer></script>
{% endif %}
