<header class="pnec-resident-header">
  <a class="pnec-resident-brand" href="{{ '/' | relative_url }}" aria-label="Poway Neighborhood Emergency Corps home"><img src="{{ '/assets/images/poway-nec-logo-white.png' | relative_url }}" alt="Poway Neighborhood Emergency Corps" width="768" height="307"></a>
  <nav aria-label="Primary navigation"><ul class="pnec-resident-links">
    <li><a href="{{ '/' | relative_url }}">Home</a></li>
    {% for item in site.data.pnec_nav %}
    <li><a href="{% if item.external %}{{ item.url | escape }}{% else %}{{ item.url | relative_url }}{% endif %}"{% if item.external %} target="_blank" rel="noopener"{% endif %}>{{ item.title | escape }}</a></li>
    {% endfor %}
    <li id="poway-auth-display-item" style="display:none"><a id="poway-auth-display-link" href="{{ '/pages/profile.html' | relative_url }}"><span id="poway-auth-display-name">My profile</span><span id="poway-auth-display-location" style="display:none"></span></a></li>
    <li id="poway-auth-login-item"><a href="{{ '/pages/register.html#login' | relative_url }}">Login</a></li>
    <li><a class="pnec-resident-donate" href="{{ '/donation-form/' | relative_url }}">Support PNEC</a></li>
  </ul></nav>
</header>
